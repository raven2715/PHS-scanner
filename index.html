<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PHS Chemical SDS Scanner</title>
  <!-- Load Mozilla PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .sds-scanner-card {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 680px;
      margin: 20px auto;
      padding: 24px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .sds-scanner-card h2 {
      margin-top: 0;
      color: #111827;
      font-size: 1.35rem;
    }
    .sds-scanner-card p {
      color: #4b5563;
      font-size: 0.95rem;
    }
    .upload-box {
      border: 2px dashed #9ca3af;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      margin: 16px 0;
      background: #f9fafb;
    }
    .btn-scan {
      background-color: #005ea2;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-scan:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 6px;
      display: none;
    }
    .match-alert {
      background-color: #fef2f2;
      border: 1px solid #f87171;
      color: #991b1b;
    }
    .clear-alert {
      background-color: #ecfdf5;
      border: 1px solid #34d399;
      color: #065f46;
    }
    .part-header {
      font-weight: 700;
      margin-top: 10px;
    }
  </style>
</head>
<body>
 
<div class="sds-scanner-card">
  <h2>🧪 SDS vs. Particularly Hazardous Substances (PHS) Scanner</h2>
  <p>Upload a Safety Data Sheet (SDS) PDF. This tool isolates <strong>Section 3 (Composition/Ingredients)</strong> and checks it against the 137 chemicals on the Table 7 PHS list.</p>
 
  <div class="upload-box">
    <input type="file" id="sdsFileInput" accept="application/pdf" />
    <br><br>
    <button class="btn-scan" id="scanBtn" onclick="scanSDS()">Scan SDS PDF</button>
  </div>
 
  <div id="statusText" style="font-size: 0.9rem; color: #374151;"></div>
  <div id="resultContainer" class="result-box"></div>
</div>
 
<script>
  // Configure PDF.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 
  // Pre-loaded 137 PHS Chemicals from Table 7 (Chemical Hygiene Plan)
  const PHS_CHEMICALS = [
    "1,2-Benzanthracene", "1,2-Dibromoethane (ethylene dibromide)", "1,3-Propanesultone",
    "1,4-Dichlorobenzene", "1,4-Dioxane", "1-Chloro-2,4-dinitrobenzene", "1-Naphthylamine",
    "17β-Estradiol (E2)", "2-Anisidine", "2-Mercaptoethanol", "2-Methylcyclohexylamine",
    "2-Naphthylamine", "2-Nitropropane", "4-Aminobiphenyl", "4-Dimethylaminopyridine",
    "5-Methylchrysene", "Acetaldehyde", "Acetamide", "Acrolein", "Acrylamide", "Acrylonitrile",
    "Aldicarb", "Aldicarb sulfone", "Ammonia (anhydrous)", "Aniline", "Arsenic (and comp.)",
    "Arsenic (elemental/inorganic comp.; except arsine)", "Arsenic trioxide", "Benzene",
    "Benzidine", "Benzofuran", "Benzyl chloride", "Beryllium", "Beryllium compounds",
    "Boric acid (solid)", "Bromine", "Brucine", "Cadmium", "Cadmium compounds",
    "Carbon disulfide", "Carbon tetrachloride", "Chloramphenicol", "Chlordane",
    "Chloroacetaldehyde", "Chloroform (trichloromethane)", "Chlorophenols (di)",
    "Chloropicrin", "Chromium(III)", "Chromium(VI) compounds (insoluble)",
    "Chromium(VI) compounds (water soluble)", "Cobalt chloride", "Cyanogen bromide",
    "Cycloheximide", "Cyclophosphamide (anhydrous)", "Cyclosporin (cyclosporine)",
    "Dacarbazine", "Dichlorodiphenyltrichloroethane (DDT)", "Dichloromethane (methylene chloride)",
    "Diethylamine", "Diethylstilbestrol", "Dioxins/Furans", "Disodium methyl arsenate",
    "Epichlorohydrin", "Estrone", "Ethidium bromide", "Ethylene oxide", "Fluoroacetamide",
    "Fluorouracil (5-FU)", "Formaldehyde", "Formamide", "Glutaraldehyde",
    "Heptachlor (and heptachlor epoxide)", "Hexane", "Hydrazine", "Hydrazine hydrate",
    "Hydrofluoric acid", "Isoprene", "Kepone", "Lead (and its inorganic comp.)",
    "Lead acetate trihydrate", "Lithium compounds", "Mercury (organic)", "Mitomycin C",
    "N,N-Dimethylformamide", "N-Lauroylsarcosine (and sodium salt)", "N-Nitrosodi-n-butylamine",
    "N-Nitrosodiethanolamine", "N-Nitrosodiethylamine", "N-Nitrosodimethylamine",
    "N-Nitrosomorpholine", "N-Nitrosonornicotine", "N-Nitrosopiperidine", "N-Nitrosopyrrolidine",
    "Nickel compounds (sulfate and sulfide)", "Nicotine (and salts)", "Nitric acid (fuming)",
    "Nitrilotriacetic acid", "Osmium tetroxide", "Paraformaldehyde", "Pentachlorobiphenyl",
    "Peracetic acid", "Phenol", "Phorate", "Phosgene", "Phosphine", "Phosphorus",
    "Picric acid", "Potassium bromate", "Potassium cyanide", "Potassium dichromate",
    "Propoxur", "Quinoline", "Reserpine", "Safrole", "Sodium arsenite", "Sodium azide (NaN3)",
    "Sodium chlorite", "Sodium dichromate(VI)", "Strychnine", "Styrene", "TRIReagent",
    "TRIzol", "Tetrachloroethylene (perchloroethylene)", "Tetrachloromethane (carbon tetrachloride)",
    "Tetrahydrofuran", "Tetramethylammonium chloride", "Thallium compounds", "Thimerosal",
    "Thiophenol (phenyl mercaptan)", "Thiourea", "Toluene", "Trypan blue", "Vinyl acetate",
    "Vinyl chloride", "Xylene", "o-Phenylenediamine dihydrochloride", "o-Toluidine", "β-Propiolactone"
  ];
 
  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
 
  function extractSections3(fullText) {
    // Isolate all Section 3 blocks up to Section 4 (supports multi-kit SDS PDFs)
    const primaryRegex = /(?:section\s*0?3\b|3\s+Composition\/information\s+on\s+ingredients)([\s\S]*?)(?=section\s*0?4\b|4\s+First-aid\s+measures)/gi;
    const matches = [];
    let match;
    while ((match = primaryRegex.exec(fullText)) !== null) {
      matches.push(match[1].trim());
    }
    return matches.length > 0 ? matches : [fullText]; // Fallback to full text if non-standard headers
  }
 
  async function scanSDS() {
    const fileInput = document.getElementById('sdsFileInput');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    resultContainer.style.display = 'none';
 
    if (!fileInput.files.length) {
      alert("Please select an SDS PDF file first.");
      return;
    }
 
    statusText.textContent = "⏳ Extracting text and scanning Section 3...";
    const file = fileInput.files[0];
 
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = "";
 
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(" ");
        fullText += pageText + "\n";
      }
 
      const section3Parts = extractSections3(fullText);
      let totalMatches = 0;
      let htmlOutput = "";
 
      section3Parts.forEach((secText, idx) => {
        const partMatches = [];
 
        PHS_CHEMICALS.forEach(chem => {
          const subNames = [chem];
          // Split parenthetical synonyms (e.g., "Dichloromethane (methylene chloride)")
          if (chem.includes("(")) {
            const parenMatches = [...chem.matchAll(/\((.*?)\)/g)];
            parenMatches.forEach(m => {
              if (m[1].length >= 3 && !m[1].includes("comp.") && !m[1].includes("solid")) {
                subNames.push(m[1]);
              }
            });
            const preParen = chem.split("(")[0].trim();
            if (preParen.length >= 3) subNames.push(preParen);
          }
 
          for (const sn of subNames) {
            const regex = new RegExp(`\\b${escapeRegExp(sn)}\\b`, "i");
            if (regex.test(secText)) {
              partMatches.push(`<strong>${chem}</strong> (matched via <em>"${sn}"</em>)`);
              totalMatches++;
              break;
            }
          }
        });
 
        if (section3Parts.length > 1) {
          htmlOutput += `<div class="part-header">Component / Sub-SDS Part ${idx + 1}:</div>`;
        }
        if (partMatches.length > 0) {
          htmlOutput += `<ul>${partMatches.map(m => `<li>⚠️ ${m}</li>`).join("")}</ul>`;
        } else if (section3Parts.length > 1) {
          htmlOutput += `<div>✅ No PHS matches in this component.</div>`;
        }
      });
 
      statusText.textContent = "";
      resultContainer.style.display = 'block';
 
      if (totalMatches > 0) {
        resultContainer.className = "result-box match-alert";
        resultContainer.innerHTML = `<strong>🚨 PHS MATCH DETECTED (${totalMatches} found)</strong><br>${htmlOutput}`;
      } else {
        resultContainer.className = "result-box clear-alert";
        resultContainer.innerHTML = `<strong>✅ No PHS Matches Found</strong><br>Scanned ${section3Parts.length} Section 3 composition block(s) against 137 PHS chemicals.`;
      }
    } catch (err) {
      statusText.textContent = "❌ Error reading PDF: " + err.message;
    }
  }
</script>
 
</body>
</html>
